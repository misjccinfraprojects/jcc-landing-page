<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Expense Management System — JCC Infraprojects Pvt. Ltd.</title>
<style>
  :root{
    --maroon:#7a0d0d; --maroon-d:#5c0909; --maroon-l:#9e1b1b;
    --ink:#1f2430; --slate:#48526b; --muted:#7a8296;
    --line:#e4e7ee; --bg:#f4f6fb; --card:#ffffff;
    --good:#1f8a4c; --good-bg:#e7f6ec;
    --warn:#b5660b; --warn-bg:#fdf3e3;
    --bad:#b42323; --bad-bg:#fbeaea;
    --blue:#1d4e89; --blue-bg:#eaf1fa;
    --radius:14px; --shadow:0 1px 3px rgba(20,25,40,.07),0 8px 24px rgba(20,25,40,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45}
  button,input,select,textarea{font-family:inherit;font-size:inherit}
  .app{display:flex;min-height:100vh}

  .side{width:238px;background:linear-gradient(180deg,var(--maroon),var(--maroon-d));color:#fff;flex:0 0 238px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .brand{display:flex;align-items:center;gap:10px;padding:16px 16px 12px}
  .brand img{width:46px;height:46px;object-fit:contain;background:#fff;border-radius:10px;padding:4px}
  .brand .bt{font-weight:800;font-size:14.5px;letter-spacing:.2px;line-height:1.15}
  .brand .bs{font-size:10.5px;opacity:.85;margin-top:3px}
  .nav{padding:8px 10px 24px}
  .nav .grp{font-size:10px;text-transform:uppercase;letter-spacing:1px;opacity:.6;margin:16px 10px 6px}
  .nav button{width:100%;text-align:left;background:transparent;border:0;color:#fff;opacity:.85;padding:9px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:2px;font-size:13.5px}
  .nav button:hover{background:rgba(255,255,255,.1);opacity:1}
  .nav button.on{background:#fff;color:var(--maroon);opacity:1;font-weight:700;box-shadow:var(--shadow)}
  .nav button .ic{width:18px;text-align:center}

  .main{flex:1;min-width:0;display:flex;flex-direction:column}
  .top{background:var(--card);border-bottom:1px solid var(--line);padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:14px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
  .top h1{font-size:18px;margin:0;font-weight:800}
  .top .sub{color:var(--muted);font-size:12px;margin-top:2px}
  .wrap{padding:20px 24px 60px;max-width:1260px;width:100%}

  .btn{border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;border-radius:10px;cursor:pointer;font-weight:600;display:inline-flex;align-items:center;gap:7px}
  .btn:hover{border-color:#c9cedb}
  .btn.p{background:var(--maroon);border-color:var(--maroon);color:#fff}
  .btn.p:hover{background:var(--maroon-l)}
  .btn.g{background:var(--good);border-color:var(--good);color:#fff}
  .btn.sm{padding:6px 10px;font-size:12.5px;border-radius:8px}
  .btn.ghost{background:transparent}
  .btn.danger{color:var(--bad);border-color:#f0cccc}
  .btn.danger:hover{background:var(--bad-bg)}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
  .pad{padding:18px}
  .stat{padding:16px 18px}
  .stat .lbl{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;display:flex;align-items:center;gap:6px}
  .stat .val{font-size:25px;font-weight:800;margin-top:6px}
  .stat .dlt{font-size:12px;color:var(--slate);margin-top:3px}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:700}
  .pill.good{background:var(--good-bg);color:var(--good)}
  .pill.warn{background:var(--warn-bg);color:var(--warn)}
  .pill.bad{background:var(--bad-bg);color:var(--bad)}
  .pill.blue{background:var(--blue-bg);color:var(--blue)}
  .pill.mut{background:#eef0f5;color:var(--slate)}

  .sec-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.7px;color:var(--slate);margin:26px 0 12px;display:flex;align-items:center;gap:8px}
  .sec-title:first-child{margin-top:0}

  table{width:100%;border-collapse:collapse}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);font-size:13px;vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;background:#fafbfe;position:sticky;top:0}
  tbody tr:hover{background:#fafbff}
  td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
  .tbl-wrap{overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:#fff;box-shadow:var(--shadow)}

  label.fl{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--slate);margin:0 0 5px}
  .addlink{margin-left:auto;font-size:11.5px;font-weight:700;color:var(--maroon-l);cursor:pointer;background:var(--maroon-bg,#f7e9e9);border:0;padding:2px 8px;border-radius:7px}
  .addlink:hover{background:#f0d9d9}
  .inp{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .inp:focus{outline:none;border-color:var(--maroon-l);box-shadow:0 0 0 3px rgba(122,13,13,.1)}
  .grid{display:grid;gap:14px}
  .g2{grid-template-columns:1fr 1fr}
  .g3{grid-template-columns:1fr 1fr 1fr}
  .g4{grid-template-columns:repeat(4,1fr)}
  .field{min-width:0}
  .row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .spacer{flex:1}
  .hint{font-size:11.5px;color:var(--muted);margin-top:5px}

  .seg{display:inline-flex;background:#eef0f5;border-radius:11px;padding:3px;gap:3px;flex-wrap:wrap}
  .seg button{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:700;font-size:12.5px;color:var(--slate)}
  .seg button.on{background:#fff;color:var(--maroon);box-shadow:var(--shadow)}

  .chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 11px;font-size:12.5px}
  .chip b{font-weight:700}
  .chip .ph{color:var(--muted);font-size:11.5px}
  .x{cursor:pointer;color:var(--muted);font-weight:800;border:0;background:transparent;font-size:14px;line-height:1}
  .x:hover{color:var(--bad)}

  .bar{height:9px;border-radius:999px;background:#eef0f5;overflow:hidden}
  .bar>span{display:block;height:100%;border-radius:999px;background:var(--maroon)}

  .empty{text-align:center;color:var(--muted);padding:40px 20px}
  .empty .big{font-size:34px;opacity:.4}

  .ov{position:fixed;inset:0;background:rgba(20,25,40,.5);display:none;align-items:center;justify-content:center;z-index:60;padding:20px}
  .ov.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:560px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.3)}
  .modal h3{margin:0;padding:18px 20px;border-bottom:1px solid var(--line);font-size:16px}
  .modal .mb{padding:20px}
  .modal .mf{padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;position:sticky;bottom:0;background:#fff}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-weight:600;z-index:90;box-shadow:0 10px 30px rgba(0,0,0,.25);opacity:0;transition:.25s;pointer-events:none}
  .toast.show{opacity:1;bottom:30px}

  .mini{font-size:12px;color:var(--muted)}
  .right{text-align:right}
  .nowrap{white-space:nowrap}
  .amt-exp{color:var(--bad);font-weight:700}
  .amt-adv{color:var(--blue);font-weight:700}
  .amt-ret{color:var(--good);font-weight:700}
  .tag{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:700;white-space:nowrap}
  .tag.exp{background:var(--bad-bg);color:var(--bad)}
  .tag.adv{background:var(--blue-bg);color:var(--blue)}
  .tag.ret{background:var(--good-bg);color:var(--good)}
  .modepill{font-size:10.5px;padding:1px 7px;border-radius:6px;background:#eef0f5;color:var(--slate);font-weight:700}
  .ctact{display:inline-flex;gap:6px}
  .ctact a{text-decoration:none;font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;border:1px solid var(--line);color:var(--slate)}
  .ctact a.wa{color:#0a7d34;border-color:#bfe6cc;background:#eafaf0}
  .ctact a.cl{color:var(--blue);border-color:#c9ddf2;background:#eef5fd}

  .report{display:none}
  @media print{
    .side,.top,.no-print{display:none !important}
    .main,.wrap{padding:0;margin:0;max-width:none}
    body{background:#fff}
    .report{display:block}
    .screen{display:none !important}
    @page{size:A4 landscape;margin:12mm}
  }
  .rep-head{text-align:center;margin-bottom:10px}
  .rep-head .c{font-size:19px;font-weight:800}
  .rep-head .p{font-size:13px;margin-top:2px}
  .rep-head .per{font-size:12px;color:#444;margin-top:2px}
  table.rep{border:1px solid #333}
  table.rep th,table.rep td{border:1px solid #999;padding:5px 7px;font-size:11px}
  table.rep th{background:#f0f0f0;color:#111}
  table.rep tfoot td{font-weight:800;background:#f6f6f6}
  .sign{display:flex;justify-content:space-between;margin-top:26px;font-size:12px}
  .sign div{text-align:center}
  .sign .ln{margin-top:34px;border-top:1px solid #333;padding-top:4px;min-width:170px}

  @media(max-width:860px){
    .side{position:fixed;left:-250px;transition:.25s;z-index:50}
    .side.open{left:0}
    .g2,.g3,.g4{grid-template-columns:1fr}
    .menu-btn{display:inline-flex !important}
  }
  .menu-btn{display:none}
  :root{--maroon-bg:#f7e9e9}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand">
      <img id="brandLogo" alt="JCC" />
      <div>
        <div class="bt">Expense Management System</div>
        <div class="bs">JCC Infraprojects Pvt. Ltd.</div>
      </div>
    </div>
    <nav class="nav" id="nav">
      <div class="grp">Overview</div>
      <button data-v="dashboard" class="on"><span class="ic">▣</span> Dashboard</button>
      <button data-v="entry"><span class="ic">✚</span> New Entry</button>
      <div class="grp">Tracking</div>
      <button data-v="ledger"><span class="ic">◉</span> Person Ledger</button>
      <button data-v="allowance"><span class="ic">◈</span> Monthly Allowance</button>
      <button data-v="history"><span class="ic">≡</span> All Entries</button>
      <button data-v="budget"><span class="ic">◐</span> Budget</button>
      <div class="grp">Output</div>
      <button data-v="report"><span class="ic">🖶</span> Reports</button>
      <div class="grp">Setup</div>
      <button data-v="masters"><span class="ic">⚙</span> Masters &amp; Backup</button>
    </nav>
  </aside>

  <div class="main">
    <header class="top">
      <div style="display:flex;align-items:center;gap:12px">
        <button class="btn sm menu-btn" onclick="document.getElementById('side').classList.toggle('open')">☰</button>
        <div>
          <h1 id="pageTitle">Dashboard</h1>
          <div class="sub" id="pageSub">Head office &amp; site expense overview</div>
        </div>
      </div>
      <div class="row-flex no-print">
        <select id="siteScope" class="inp" style="width:auto" onchange="render()"></select>
        <select id="periodScope" class="inp" style="width:auto" onchange="onPeriodChange()">
          <option value="tm">This Month</option>
          <option value="lm">Last Month</option>
          <option value="fy">This Financial Year</option>
          <option value="all">All Time</option>
          <option value="custom">Custom Range…</option>
        </select>
        <input type="date" id="fromDate" class="inp" style="width:auto;display:none" onchange="render()" title="From date">
        <input type="date" id="toDate" class="inp" style="width:auto;display:none" onchange="render()" title="To date">
        <button class="btn p sm" onclick="go('entry')">✚ Add Expense</button>
      </div>
    </header>
    <div class="wrap screen" id="view"></div>
    <div class="report" id="reportOut"></div>
  </div>
</div>

<div class="ov" id="ov"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ===================== STORAGE ===================== */
const KEY="jcc_expense_mgmt_v1";
const MODES=["Cash","UPI","Bank Transfer","Cheque","Card"];
const DEFAULT={
  settings:{company:"JCC Infraprojects Pvt. Ltd.", place:"Ajmer, Rajasthan", preparedBy:"", checkedBy:""},
  sites:["Head Office (Ajmer)","Bharatpur Elevated Flyover","Gandhinagar Railway Station","JNE Pkg-04 (Parbhani)","Jalore ROB (LC-114)","Amritsar Station"],
  heads:["Office Exp.","Postage / Courier Exp.","Computer Repairing / Stationary","Refreshment Exp.","Mess Exp.","Repairing Works","Travelling Exp.","Newspaper / Periodicals","Advance / Misc."],
  people:[{name:"Rajkumar",phone:"",allowance:0},{name:"Arun",phone:"",allowance:0},{name:"Nitin Kumar",phone:"",allowance:15000,floatSite:"all"}],
  budgets:{},
  entries:[]   // {id,date,kind,site,head,person,particular,amount,mode,alw,ts}
};
let DB=load();
function load(){
  try{
    const r=JSON.parse(localStorage.getItem(KEY));
    if(r&&r.entries){
      const db=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),r);
      if(db.people&&db.people.length&&typeof db.people[0]==="string") db.people=db.people.map(n=>({name:n,phone:"",allowance:0}));
      db.people.forEach(p=>{if(p.allowance===undefined)p.allowance=0;if((+p.allowance||0)>0&&!p.floatSite)p.floatSite="all";});
      (db.entries||[]).forEach(e=>{if(e.mode===undefined)e.mode="Cash";});
      return db;
    }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function save(){ localStorage.setItem(KEY,JSON.stringify(DB)); }
const uid=()=> Date.now().toString(36)+Math.random().toString(36).slice(2,7);

/* ===================== HELPERS ===================== */
const INR=n=> "₹"+(Math.round((+n||0)*100)/100).toLocaleString('en-IN');
const INRp=n=> (Math.round((+n||0)*100)/100).toLocaleString('en-IN');
function esc(s){return (s==null?"":String(s)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
const pad=n=>String(n).padStart(2,'0');
function todayISO(){const d=new Date();return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function fmtDate(iso){ if(!iso) return "—"; const [y,m,d]=iso.split('-'); return d+"-"+m+"-"+y; }
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1900);}
function peopleNames(){return DB.people.map(p=>p.name);}
function personPhone(name){const p=DB.people.find(x=>x.name===name);return p?p.phone:"";}

/* date range from period scope */
function computeRange(){
  const p=document.getElementById('periodScope').value;
  const now=new Date(); const y=now.getFullYear(), m=now.getMonth();
  const iso=(yy,mm,dd)=>yy+"-"+pad(mm)+"-"+pad(dd);
  if(p==="all") return {from:null,to:null,label:"All Time"};
  if(p==="custom"){const f=document.getElementById('fromDate').value,t=document.getElementById('toDate').value;return{from:f||null,to:t||null,label:(f?fmtDate(f):"start")+" to "+(t?fmtDate(t):"today")};}
  if(p==="tm"){return{from:iso(y,m+1,1),to:iso(y,m+1,new Date(y,m+1,0).getDate()),label:new Date(y,m,1).toLocaleString('en-US',{month:'long',year:'numeric'})};}
  if(p==="lm"){const d=new Date(y,m-1,1);const yy=d.getFullYear(),mm=d.getMonth();return{from:iso(yy,mm+1,1),to:iso(yy,mm+1,new Date(yy,mm+1,0).getDate()),label:d.toLocaleString('en-US',{month:'long',year:'numeric'})};}
  if(p==="fy"){const start=(m>=3)?y:y-1;return{from:iso(start,4,1),to:iso(start+1,3,31),label:"FY "+start+"-"+String(start+1).slice(2)};}
  return {from:null,to:null,label:"All"};
}
function onPeriodChange(){
  const custom=document.getElementById('periodScope').value==="custom";
  document.getElementById('fromDate').style.display=custom?"":"none";
  document.getElementById('toDate').style.display=custom?"":"none";
  render();
}
function scoped(){
  const site=document.getElementById('siteScope').value;
  const {from,to}=computeRange();
  return DB.entries.filter(e=>{
    if(site!=="__all" && e.site!==site) return false;
    if(from && (e.date||"")<from) return false;
    if(to && (e.date||"")>to) return false;
    return true;
  });
}
function personBalance(name, siteFilter){
  let adv=0,exp=0,ret=0;
  DB.entries.forEach(e=>{
    if(e.person!==name) return;
    if(siteFilter && siteFilter!=="__all" && e.site!==siteFilter) return;
    if(e.kind==="advance") adv+=+e.amount||0;
    else if(e.kind==="return") ret+=+e.amount||0;
    else exp+=+e.amount||0;
  });
  return {adv,exp,ret,bal:adv-exp-ret};
}

/* ===================== MONTHLY ALLOWANCE / OFFICE FLOAT ===================== */
/* A float = a fixed monthly amount held by a person. "Covers" decides which
   expenses come out of it: all sites, one site, or only that person's own
   tagged expenses. Balance deducts automatically — no manual crediting. */
function personAllowance(name){const p=DB.people.find(x=>x.name===name);return p?(+p.allowance||0):0;}
function curYM(){return todayISO().slice(0,7);}
function ymLabel(ym){const [y,m]=ym.split('-');return new Date(+y,+m-1,1).toLocaleString('en-US',{month:'long',year:'numeric'});}
function floatScopeOf(name){const p=DB.people.find(x=>x.name===name);return (p&&p.floatSite)?p.floatSite:"all";}
function floatStartOf(name){const p=DB.people.find(x=>x.name===name);return (p&&p.allowanceStart)?p.allowanceStart:curYM();}
function scopeLabel(sc){return sc==="self"?"Only this person's expenses":sc==="all"?"All sites":sc;}
function floatMatch(name,e){
  if(e.kind!=="expense") return false;
  const sc=floatScopeOf(name);
  if(sc==="self") return e.person===name;
  if(sc==="all") return true;
  return e.site===sc;
}
function floatSpent(name,ym){let s=0;DB.entries.forEach(e=>{if((e.date||'').slice(0,7)===ym && floatMatch(name,e))s+=+e.amount||0;});return s;}
function monthsFromTo(a,b){const out=[];let[ay,am]=a.split('-').map(Number);const[by,bm]=b.split('-').map(Number);let g=0;while((ay<by||(ay===by&&am<=bm))&&g<600){out.push(ay+'-'+String(am).padStart(2,'0'));am++;if(am>12){am=1;ay++;}g++;}return out;}
function floatCalc(name,ym){
  const alw=personAllowance(name); const scope=floatScopeOf(name); const start=floatStartOf(name);
  if(alw<=0) return {alw:0,open:0,spent:0,close:0,scope,start};
  if(ym<start) return {alw,open:0,spent:0,close:0,scope,start,before:true};
  const months=monthsFromTo(start,ym);
  let open=0;
  for(let i=0;i<months.length-1;i++) open+=alw-floatSpent(name,months[i]);
  const spent=floatSpent(name,ym);
  return {alw,open,spent,close:open+alw-spent,scope,start};
}
let _alwMonth="";
function setAlwMonth(v){_alwMonth=v||curYM();render();}
function setAllowance(name,v){const p=DB.people.find(x=>x.name===name);if(!p)return;p.allowance=parseFloat(v)||0;if(p.allowance>0&&!p.floatSite)p.floatSite="all";if(p.allowance>0&&!p.allowanceStart)p.allowanceStart=_alwMonth||curYM();save();render();}
function setFloatScope(name,v){const p=DB.people.find(x=>x.name===name);if(!p)return;p.floatSite=v;save();render();}
function setFloatStart(name,v){const p=DB.people.find(x=>x.name===name);if(!p)return;p.allowanceStart=v||curYM();save();render();}
function scopeOptions(name){const cur=floatScopeOf(name);
  return `<option value="all" ${cur==="all"?"selected":""}>All sites</option>`+
    DB.sites.map(s=>`<option value="${esc(s)}" ${cur===s?"selected":""}>${esc(s)} only</option>`).join('')+
    `<option value="self" ${cur==="self"?"selected":""}>Only this person's own expenses</option>`;
}
function viewAllowance(){
  if(!_alwMonth) _alwMonth=curYM();
  const ym=_alwMonth;
  const withAlw=DB.people.filter(p=>(+p.allowance||0)>0);
  const totMonthly=withAlw.reduce((a,p)=>a+(+p.allowance||0),0);
  const totInHand=withAlw.reduce((a,p)=>a+floatCalc(p.name,ym).close,0);
  const rows=withAlw.map(p=>{
    const name=p.name; const fc=floatCalc(name,ym);
    return `<tr>
      <td><b>${esc(name)}</b>${personPhone(name)?`<div class="mini">${esc(personPhone(name))}</div>`:''}
          <div class="mini">from <input type="month" value="${esc(fc.start)}" onchange="setFloatStart('${esc(name)}',this.value)" style="border:1px solid var(--line);border-radius:6px;padding:1px 4px;font-size:11px"></div></td>

  }).join('');
  const noAlw=DB.people.filter(p=>!((+p.allowance||0)>0));
  return `
  <div class="card pad" style="margin-bottom:16px">
    <div class="row-flex">
      <label class="fl" style="margin-bottom:0">Month</label>

      <div class="spacer"></div>

      <span class="pill ${totInHand<0?'bad':'good'}">In hand ${INR(totInHand)}</span>
    </div>
    <div class="hint"><b>Covers</b> decides which expenses come out of a float. <b>All sites</b> = every expense entered reduces it (whoever did it). Pick <b>one site</b> to limit it to that site's expenses. The balance deducts automatically the moment you save an expense — no "received" click needed. Leftover carries into next month from the <b>from</b> month.</div>
  </div>

  <div class="tbl-wrap">
    <table><thead><tr><th>Person (holds float)</th><th class="num">Amount / month</th><th>Covers</th><th class="num">Opening (carry)</th><th class="num">Spent in ${esc(ymLabel(ym))}</th><th class="num">Balance in hand</th><th class="right">Actions</th></tr></thead>
    <tbody>${rows|| `<tr><td colspan="7"><div class="empty"><div class="big">◈</div>No one has a monthly float yet.<br><span class="mini">Set an amount below, or in <b>Masters → Persons</b> (e.g. Nitin Kumar ₹15,000, Covers: All sites).</span></div></td></tr>`}</tbody></table>
  </div>
  ${noAlw.length?`<div class="hint" style="margin-top:10px">No float for: ${noAlw.map(p=>esc(p.name)).join(', ')} — set an amount for them in <b>Masters → Persons</b> if they also hold a fixed monthly cash.</div>`:''}
  <div class="hint">Example — Nitin holds ₹15,000, Covers = All sites. Arun enters a ₹500 expense → float drops to ₹14,500 automatically, even though it was tagged to Arun.</div>`;
}

/* ===================== NAV ===================== */
const TITLES={dashboard:["Dashboard","Head office & site expense overview"],entry:["New Entry","Add an expense, advance or return — minimum fields"],ledger:["Person Ledger","Doer-wise advances, expenses & running balance"],allowance:["Monthly Allowance","Fixed monthly float per person — credit each month, expenses auto-deduct"],history:["All Entries","Full history with date & other filters"],budget:["Budget","Set budgets and track budget vs actual"],report:["Reports","Expense statement & person statement — print / PDF"],masters:["Masters & Backup","Manage sites, heads, persons & data backup"]};
let VIEW="dashboard";
function go(v){VIEW=v;document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  document.getElementById('pageTitle').textContent=TITLES[v][0];
  document.getElementById('pageSub').textContent=TITLES[v][1];
  document.getElementById('side').classList.remove('open');
  render();}
document.getElementById('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(b)go(b.dataset.v);});

function fillSiteScope(){
  const s=document.getElementById('siteScope'); const cur=s.value||"__all";
  s.innerHTML='<option value="__all">All Sites</option>'+DB.sites.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
  s.value=[...s.options].some(o=>o.value===cur)?cur:"__all";
}

/* ===================== ROUTER ===================== */
function render(){
  fillSiteScope();
  const el=document.getElementById('view');
  if(VIEW==="dashboard") el.innerHTML=viewDashboard();
  else if(VIEW==="entry") el.innerHTML=viewEntry();
  else if(VIEW==="ledger") el.innerHTML=viewLedger();
  else if(VIEW==="allowance") el.innerHTML=viewAllowance();
  else if(VIEW==="history") el.innerHTML=viewHistory();
  else if(VIEW==="budget") el.innerHTML=viewBudget();
  else if(VIEW==="report") el.innerHTML=viewReport();
  else if(VIEW==="masters") el.innerHTML=viewMasters();
  if(VIEW==="entry") initEntry();
  if(VIEW==="history") initHistory();
}

/* ===================== DASHBOARD ===================== */
function viewDashboard(){
  const ent=scoped();
  const expEnt=ent.filter(e=>e.kind!=="advance"&&e.kind!=="return");
  const total=expEnt.reduce((a,e)=>a+(+e.amount||0),0);
  const advTot=ent.filter(e=>e.kind==="advance").reduce((a,e)=>a+(+e.amount||0),0);
  const byHead={}; expEnt.forEach(e=>byHead[e.head]=(byHead[e.head]||0)+(+e.amount||0));
  const heads=Object.entries(byHead).sort((a,b)=>b[1]-a[1]);
  const maxHead=heads.length?heads[0][1]:1;
  const bySite={}; expEnt.forEach(e=>bySite[e.site]=(bySite[e.site]||0)+(+e.amount||0));
  const sites=Object.entries(bySite).sort((a,b)=>b[1]-a[1]);
  const maxSite=sites.length?sites[0][1]:1;
  const byMode={}; expEnt.forEach(e=>byMode[e.mode||"Cash"]=(byMode[e.mode||"Cash"]||0)+(+e.amount||0));
  const siteF=document.getElementById('siteScope').value;
  const outs=peopleNames().map(p=>({p,...personBalance(p,siteF)})).filter(o=>Math.abs(o.bal)>0.001).sort((a,b)=>b.bal-a.bal);
  const totalOut=outs.reduce((a,o)=>a+(o.bal>0?o.bal:0),0);
  const recent=[...ent].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,8);
  const rng=computeRange();
  const pal=["#7a0d0d","#1d4e89","#1f8a4c","#b5660b","#6b3fa0","#0d7a74","#a3341f","#48526b","#9e1b1b"];

  return `
  <div class="row-flex" style="margin:-4px 0 14px"><span class="pill blue">${esc(siteF==="__all"?'All Sites':siteF)}</span><span class="pill mut">${esc(rng.label)}</span></div>
  <div class="cards">
    <div class="card stat"><div class="lbl">◴ Total Expense</div><div class="val">${INR(total)}</div><div class="dlt">${expEnt.length} expense entries</div></div>
    <div class="card stat"><div class="lbl">◉ Advances Given</div><div class="val" style="color:var(--blue)">${INR(advTot)}</div><div class="dlt">cash handed to persons</div></div>
    <div class="card stat"><div class="lbl">⚠ Unsettled (held by persons)</div><div class="val" style="color:var(--warn)">${INR(totalOut)}</div><div class="dlt">${outs.filter(o=>o.bal>0).length} person(s) to account</div></div>
    <div class="card stat"><div class="lbl">▣ Active Heads</div><div class="val">${heads.length}</div><div class="dlt">of ${DB.heads.length} category heads</div></div>
  </div>

  <div class="grid g2" style="margin-top:18px">
    <div class="card pad">
      <div class="sec-title" style="margin-top:0">Expense by Category Head</div>
      ${heads.length? heads.map((h,i)=>`
        <div style="margin-bottom:11px">
          <div class="row-flex" style="justify-content:space-between"><span>${esc(h[0])}</span><b class="nowrap">${INR(h[1])}</b></div>
          <div class="bar"><span style="width:${Math.max(3,h[1]/maxHead*100)}%;background:${pal[i%pal.length]}"></span></div>
        </div>`).join('') : emptyMini("No expenses in this period")}
    </div>
    <div class="card pad">
      <div class="sec-title" style="margin-top:0">Expense by Site</div>
      ${sites.length? sites.map((h,i)=>`
        <div style="margin-bottom:11px">
          <div class="row-flex" style="justify-content:space-between"><span>${esc(h[0])}</span><b class="nowrap">${INR(h[1])}</b></div>
          <div class="bar"><span style="width:${Math.max(3,h[1]/maxSite*100)}%;background:${pal[(i+2)%pal.length]}"></span></div>
        </div>`).join('') : emptyMini("No expenses in this period")}
      <div class="sec-title">By Payment Mode</div>
      <div class="row-flex">${Object.entries(byMode).length?Object.entries(byMode).sort((a,b)=>b[1]-a[1]).map(m=>`<span class="pill mut">${esc(m[0])}: ${INR(m[1])}</span>`).join(''):'<span class="mini">—</span>'}</div>
    </div>
  </div>

  <div class="grid g2" style="margin-top:18px">
    <div class="card pad">
      <div class="sec-title" style="margin-top:0">⚠ Persons to Account (all-time${siteF!=="__all"?", "+esc(siteF):""})</div>
      ${outs.length? `<div class="tbl-wrap" style="box-shadow:none;border:0">
        <table><thead><tr><th>Person</th><th class="num">Given</th><th class="num">Spent</th><th class="num">Balance</th><th></th></tr></thead><tbody>
        ${outs.map(o=>`<tr>
          <td><b>${esc(o.p)}</b></td>
          <td class="num">${INRp(o.adv)}</td>
          <td class="num">${INRp(o.exp+o.ret)}</td>
          <td class="num"><span class="pill ${o.bal>0?'warn':'good'}">${o.bal>0?'holds ':'owed '} ${INRp(Math.abs(o.bal))}</span></td>
          <td class="right"><button class="btn sm ghost" onclick="openLedger('${esc(o.p)}')">View</button></td>
        </tr>`).join('')}
        </tbody></table></div>`: emptyMini("Everyone settled 👍")}
    </div>
    <div class="card pad">
      <div class="sec-title" style="margin-top:0">Recent Activity</div>
      ${recent.length? recent.map(e=>`
        <div class="row-flex" style="justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">
          <div style="min-width:0">
            <div><b>${esc(e.particular||e.head)}</b> ${kindTag(e.kind)}</div>
            <div class="mini">${fmtDate(e.date)} · ${esc(e.site)}${e.person?' · '+esc(e.person):''} · ${esc(e.mode||'Cash')}</div>
          </div>
          <b class="nowrap ${amtCls(e.kind)}">${INRp(e.amount)}</b>
        </div>`).join('') : emptyMini("No activity yet")}
    </div>
  </div>`;
}
function emptyMini(t){return `<div class="empty"><div>${t}</div></div>`;}
function kindTag(k){return k==="advance"?'<span class="tag adv">Advance</span>':k==="return"?'<span class="tag ret">Return</span>':'<span class="tag exp">Expense</span>';}
function amtCls(k){return k==="advance"?"amt-adv":k==="return"?"amt-ret":"amt-exp";}

    <div class="row-flex" style="margin-top:20px">
      <button class="btn p" onclick="saveEntry()">✔ Save Entry</button>

  <div class="card pad" style="margin-top:18px">

let _entryKind="expense", _session=[];
function initEntry(){
  _entryKind="expense";
  document.getElementById('f_date').value=todayISO();
  refillEntrySelects();
  document.getElementById('kindSeg').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b)return;
    _entryKind=b.dataset.k;
    document.querySelectorAll('#kindSeg button').forEach(x=>x.classList.toggle('on',x===b));
    applyKindUI();
  });
  document.getElementById('f_person').addEventListener('change',showBalHint);
  document.getElementById('f_site').addEventListener('change',showBalHint);
  applyKindUI();
  renderSession();
}
function fillSelect(id,arr,allowBlank){
  const s=document.getElementById(id); if(!s)return;
  s.innerHTML=(allowBlank?'<option value="">— none —</option>':'')+arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');
}
function refillEntrySelects(sel){
  const sv=val('f_site'),hv=val('f_head'),pv=val('f_person');
  fillSelect('f_site',DB.sites);
  fillSelect('f_head',DB.heads);
  fillSelect('f_person',peopleNames(),true);
  if(sv)setVal('f_site',sv); if(hv)setVal('f_head',hv); if(pv!==null)setVal('f_person',pv);
  if(sel){ if(sel.field==="sites")setVal('f_site',sel.name); if(sel.field==="heads")setVal('f_head',sel.name); if(sel.field==="people")setVal('f_person',sel.name); }
  showBalHint();
}
function val(id){const e=document.getElementById(id);return e?e.value:null;}
function setVal(id,v){const e=document.getElementById(id);if(!e)return;if(e.options){if([...e.options].some(o=>o.value===v))e.value=v;}else{e.value=v;}}
function applyKindUI(){
  const hw=document.getElementById('headWrap'), pr=document.getElementById('personReq'), hint=document.getElementById('kindHint');
  if(_entryKind==="expense"){
    hw.style.display=""; pr.textContent="(optional)";
    hint.textContent="Direct office expense. Optionally tag a person to deduct from the advance they already hold.";
  }else if(_entryKind==="advance"){
    hw.style.display="none"; pr.textContent="(required)";
    hint.textContent="Cash handed to a person. Increases their held balance. Not an expense until they report spends.";
  }else{
    hw.style.display="none"; pr.textContent="(required)";
    hint.textContent="Person returns leftover cash. Reduces their held balance.";
  }
  showBalHint();
}
function showBalHint(){
  const p=val('f_person'), site=val('f_site'), h=document.getElementById('balHint');
  if(!p){h.textContent="";return;}
  const b=personBalance(p,site);
  if(b.bal>0.001) h.innerHTML=`<span class="pill warn">${esc(p)} holds ${INRp(b.bal)} at ${esc(site)}</span>`;
  else if(b.bal<-0.001) h.innerHTML=`<span class="pill good">Company owes ${esc(p)} ${INRp(-b.bal)}</span>`;
  else h.innerHTML=`<span class="pill mut">${esc(p)} settled at this site</span>`;
}
function saveEntry(){
  const date=val('f_date')||todayISO();
  const site=val('f_site'), head=val('f_head'), person=val('f_person');
  const amount=parseFloat(val('f_amt')); const mode=val('f_mode'); const part=val('f_part').trim();
  if(!amount||amount<=0){toast("Enter a valid amount");return;}
  if((_entryKind==="advance"||_entryKind==="return")&&!person){toast("Select a person");return;}
  const e={id:uid(),date,kind:_entryKind,site,head:_entryKind==="expense"?head:"Advance / Misc.",person,particular:part,amount,mode,ts:Date.now()};
  DB.entries.push(e); save();
  _session.unshift(e); renderSession();
  document.getElementById('f_amt').value=""; document.getElementById('f_part').value="";
  document.getElementById('f_amt').focus();
  showBalHint();
  toast("Saved ✔");
}
function resetEntry(){document.getElementById('f_amt').value="";document.getElementById('f_part').value="";document.getElementById('f_person').value="";showBalHint();}
function renderSession(){
  const el=document.getElementById('justAdded'); if(!el)return;
  if(!_session.length){el.innerHTML='<div class="empty"><div class="mini">New entries will appear here.</div></div>';return;}
  el.innerHTML=`<div class="tbl-wrap" style="box-shadow:none;border:0"><table><thead><tr><th>Date</th><th>Type</th><th>Site</th><th>Head</th><th>Person</th><th>Mode</th><th>Particular</th><th class="num">Amount</th></tr></thead><tbody>
  ${_session.map(e=>`<tr><td class="nowrap">${fmtDate(e.date)}</td><td>${kindTag(e.kind)}</td><td>${esc(e.site)}</td><td>${e.kind==="expense"?esc(e.head):'—'}</td><td>${esc(e.person)||'—'}</td><td><span class="modepill">${esc(e.mode||'Cash')}</span></td><td>${esc(e.particular)||'—'}</td><td class="num ${amtCls(e.kind)}">${INRp(e.amount)}</td></tr>`).join('')}
  </tbody></table></div>`;
}

/* ===================== QUICK ADD (inline) ===================== */
function quickAdd(field){
  if(field==="people"){
    openModal("Add Person / Doer",
      `<label class="fl">Name</label><input id="qa_name" class="inp" placeholder="Full name">
       <label class="fl" style="margin-top:12px">Phone (optional)</label><input id="qa_phone" class="inp" placeholder="10-digit mobile">`,
      `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="doQuickAdd('people')">Add Person</button>`);
  }else{
    const t=field==="sites"?"Site":"Category Head";
    openModal("Add "+t,`<label class="fl">${t} name</label><input id="qa_name" class="inp" placeholder="${t} name">`,
      `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="doQuickAdd('${field}')">Add ${t}</button>`);
  }
  setTimeout(()=>{const n=document.getElementById('qa_name');if(n)n.focus();},50);
}
function doQuickAdd(field){
  const name=document.getElementById('qa_name').value.trim(); if(!name){toast("Enter a name");return;}
  if(field==="people"){
    if(DB.people.some(p=>p.name===name)){toast("Already exists");return;}
    DB.people.push({name,phone:document.getElementById('qa_phone').value.trim()});
  }else{
    if(DB[field].includes(name)){toast("Already exists");return;}
    DB[field].push(name);
  }
  save(); closeModal();
  if(VIEW==="entry") refillEntrySelects({field,name});
  else render();
  toast("Added ✔");
}

/* ===================== PERSON LEDGER ===================== */
let _ledgerPerson="";
function openLedger(p){_ledgerPerson=p;go('ledger');}
function viewLedger(){
  if(!DB.people.length) return `<div class="card pad"><div class="empty">No persons yet. Add from <b>New Entry → ＋ Add person</b> or <b>Masters</b>.</div></div>`;
  if(!_ledgerPerson||!peopleNames().includes(_ledgerPerson)) _ledgerPerson=DB.people[0].name;
  const siteF=document.getElementById('siteScope').value;
  const phone=personPhone(_ledgerPerson);
  const rows=DB.entries.filter(e=>e.person===_ledgerPerson && (siteF==="__all"||e.site===siteF))
    .sort((a,b)=>(a.date||"").localeCompare(b.date||"")|| (a.ts||0)-(b.ts||0));
  let run=0;
  const body=rows.map(e=>{
    const sign=e.kind==="advance"?+1:-1; run+=sign*(+e.amount||0);
    return `<tr>
      <td class="nowrap">${fmtDate(e.date)}</td>
      <td>${kindTag(e.kind)}</td>
      <td>${e.kind==="expense"?esc(e.head):'—'}</td>
      <td>${esc(e.site)}</td>
      <td><span class="modepill">${esc(e.mode||'Cash')}</span></td>
      <td>${esc(e.particular)||'—'}</td>
      <td class="num">${e.kind==="advance"?INRp(e.amount):''}</td>
      <td class="num">${e.kind!=="advance"?INRp(e.amount):''}</td>
      <td class="num"><b>${run>=0?INRp(run):'('+INRp(-run)+')'}</b></td>
    </tr>`;
  }).join('');
  const b=personBalance(_ledgerPerson,siteF);
  const statusPill = b.bal>0.001?`<span class="pill warn">Holds ${INRp(b.bal)} — to account</span>`
    : b.bal<-0.001?`<span class="pill good">Company owes ${INRp(-b.bal)}</span>`
    : `<span class="pill good">Fully settled</span>`;
  const contact = phone? `<span class="ctact"><a class="cl" href="tel:${esc(phone)}">📞 ${esc(phone)}</a><a class="wa" href="https://wa.me/91${esc(phone.replace(/\\D/g,''))}" target="_blank">WhatsApp</a></span>`
    : `<button class="btn sm ghost" onclick="editPerson('${esc(_ledgerPerson)}')">＋ Add phone</button>`;
  return `
  <div class="row-flex" style="margin-bottom:14px">
    <select class="inp" style="width:auto;min-width:220px" onchange="_ledgerPerson=this.value;render()">
      ${DB.people.map(p=>`<option ${p.name===_ledgerPerson?'selected':''}>${esc(p.name)}</option>`).join('')}
    </select>
    ${statusPill}
    ${contact}
    <div class="spacer"></div>
    ${Math.abs(b.bal)>0.001?`<button class="btn g sm" onclick="settleUp('${esc(_ledgerPerson)}')">✔ Settle up</button>`:''}
    <button class="btn sm" onclick="printStatement('${esc(_ledgerPerson)}')">🖶 Statement</button>
    <button class="btn sm" onclick="go('entry')">✚ New</button>
  </div>

  ${(function(){const al=personAllowance(_ledgerPerson);if(al<=0)return '';const ym=curYM();const fc=floatCalc(_ledgerPerson,ym);return `
  <div class="card pad" style="margin-bottom:16px;border-left:4px solid var(--blue)">

function initHistory(){
  fillSelect2('h_site',DB.sites); fillSelect2('h_head',DB.heads); fillSelect2('h_person',peopleNames());
  setV('h_q',_hf.q);setV('h_site',_hf.site);setV('h_head',_hf.head);setV('h_person',_hf.person);setV('h_kind',_hf.kind);setV('h_mode',_hf.mode);setV('h_from',_hf.from);setV('h_to',_hf.to);

  drawHistory();
}
function setV(id,v){const e=document.getElementById(id);if(e)e.value=v;}
function fillSelect2(id,arr){document.getElementById(id).innerHTML='<option value="__all">All</option>'+arr.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');}
function datePreset(p){
  const now=new Date();
  if(p==="clear"){setV('h_from','');setV('h_to','');}
  else if(p==="today"){setV('h_from',todayISO());setV('h_to',todayISO());}
  else if(p==="7"){const d=new Date(now);d.setDate(d.getDate()-6);setV('h_from',d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()));setV('h_to',todayISO());}
  else if(p==="month"){setV('h_from',now.getFullYear()+"-"+pad(now.getMonth()+1)+"-01");setV('h_to',todayISO());}
  applyHistory();
}
function applyHistory(){
  _hf={q:val2('h_q').trim().toLowerCase(),site:val2('h_site'),head:val2('h_head'),person:val2('h_person'),kind:val2('h_kind'),mode:val2('h_mode'),from:val2('h_from'),to:val2('h_to')};
  drawHistory();
}
function val2(id){const e=document.getElementById(id);return e?e.value:"";}
function clearHistory(){_hf={q:"",site:"__all",head:"__all",person:"__all",kind:"__all",mode:"__all",from:"",to:""};initHistory();}
function histFiltered(){
  return DB.entries.filter(e=>{
    if(_hf.site!=="__all"&&e.site!==_hf.site)return false;
    if(_hf.head!=="__all"&&e.head!==_hf.head)return false;
    if(_hf.person!=="__all"&&e.person!==_hf.person)return false;
    if(_hf.kind!=="__all"&&e.kind!==_hf.kind)return false;
    if(_hf.mode!=="__all"&&(e.mode||"Cash")!==_hf.mode)return false;
    if(_hf.from&&(e.date||"")<_hf.from)return false;
    if(_hf.to&&(e.date||"")>_hf.to)return false;
    if(_hf.q&&!((e.particular||"").toLowerCase().includes(_hf.q)||(e.head||"").toLowerCase().includes(_hf.q)||(e.person||"").toLowerCase().includes(_hf.q)))return false;
    return true;
  }).sort((a,b)=>(b.date||"").localeCompare(a.date||"")||(b.ts||0)-(a.ts||0));
}
function drawHistory(){
  const rows=histFiltered();

  document.getElementById('histResult').innerHTML=`
  <div class="row-flex no-print" style="margin-bottom:10px">

  ${rows.length? rows.map(e=>`<tr>
    <td class="nowrap">${fmtDate(e.date)}</td>

    <td>${esc(e.site)}</td>

    <td class="right nowrap"><button class="btn sm ghost" onclick="editEntry('${e.id}')">✎</button><button class="btn sm ghost" onclick="delEntry('${e.id}')">🗑</button></td>
  </tr>`).join('') : `<tr><td colspan="9"><div class="empty"><div class="big">🔍</div>No entries match these filters.</div></td></tr>`}
  </tbody></table></div>`;
}
function exportCSV(){
  const rows=histFiltered();
  const head=["Date","Type","Site","Head","Person","Mode","Particular","Amount"];
  const lines=[head.join(",")].concat(rows.map(e=>[fmtDate(e.date),e.kind,e.site,e.kind==="expense"?e.head:"",e.person||"",e.mode||"Cash",(e.particular||"").replace(/,/g,";"),e.amount].map(x=>`"${String(x).replace(/"/g,'""')}"`).join(",")));
  dl("expenses_"+todayISO()+".csv",lines.join("\n"),"text/csv");
}

function viewMasters(){
  return `
  <div class="grid g2">
    ${masterCard("Sites","sites","🏗")}
    ${masterCard("Category Heads","heads","▣")}
  </div>
  <div class="grid g2" style="margin-top:16px">
    ${peopleCard()}
    <div class="card pad">
      <div class="sec-title" style="margin-top:0">🏢 Company & Report Settings</div>
      <label class="fl">Company Name</label><input class="inp" value="${esc(DB.settings.company)}" onchange="DB.settings.company=this.value;save()">
      <label class="fl" style="margin-top:10px">Place</label><input class="inp" value="${esc(DB.settings.place)}" onchange="DB.settings.place=this.value;save()">
      <div class="grid g2" style="margin-top:10px">
        <div><label class="fl">Prepared By</label><input class="inp" value="${esc(DB.settings.preparedBy)}" onchange="DB.settings.preparedBy=this.value;save()"></div>
        <div><label class="fl">Checked By</label><input class="inp" value="${esc(DB.settings.checkedBy)}" onchange="DB.settings.checkedBy=this.value;save()"></div>
      </div>
    </div>
  </div>

  <div class="card pad" style="margin-top:16px">
    <div class="sec-title" style="margin-top:0">💾 Backup & Restore</div>
    <p class="mini">Data is saved in this browser automatically. To move it to another computer, share with a colleague, or keep a safe copy, export the backup file and import it anywhere.</p>
    <div class="row-flex">
      <button class="btn g" onclick="exportBackup()">⭳ Export Backup (.json)</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">⭱ Import Backup</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importBackup(this)">
      <button class="btn sm" onclick="exportCSVall()">⭳ All entries (CSV)</button>
      <div class="spacer"></div>
      <button class="btn danger sm" onclick="wipe()">Clear all data</button>
    </div>
  </div>`;

function masterCard(title,field,ic){
  const arr=DB[field];
  return `<div class="card pad">
    <div class="sec-title" style="margin-top:0">${ic} ${title} <span class="pill mut">${arr.length}</span></div>
    <div class="row-flex" style="margin-bottom:12px">
      <input class="inp" id="add_${field}" placeholder="Add new ${title.toLowerCase().replace(/s$/,'')}..." onkeyup="if(event.key==='Enter')addMaster('${field}')">
      <button class="btn p sm" onclick="addMaster('${field}')">＋ Add</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      ${arr.map((x,i)=>`<span class="chip"><b>${esc(x)}</b> <button class="x" title="Rename" onclick="renameMaster('${field}',${i})">✎</button><button class="x" title="Remove" onclick="removeMaster('${field}',${i})">×</button></span>`).join('')||'<span class="mini">None yet.</span>'}
    </div>
  </div>`;
}
function peopleCard(){
  return `<div class="card pad">
    <div class="sec-title" style="margin-top:0">◉ Persons / Doers <span class="pill mut">${DB.people.length}</span></div>
    <div class="row-flex" style="margin-bottom:12px">
      <input class="inp" id="pp_name" placeholder="Name" style="flex:2;min-width:110px">
      <input class="inp" id="pp_phone" placeholder="Phone (optional)" style="flex:1;min-width:100px">
      <input class="inp" id="pp_alw" type="number" min="0" placeholder="Monthly ₹ (optional)" style="flex:1;min-width:120px">
      <button class="btn p sm" onclick="addPersonMaster()">＋ Add</button>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:8px">
      ${DB.people.map((p,i)=>`<span class="chip"><b>${esc(p.name)}</b>${p.phone?` <span class="ph">📞 ${esc(p.phone)}</span>`:''}${(+p.allowance||0)>0?` <span class="ph" style="color:var(--blue)">◈ ${INRp(p.allowance)}/mo</span>`:''} <button class="x" title="Edit" onclick="editPerson('${esc(p.name)}')">✎</button><button class="x" title="Remove" onclick="removePerson(${i})">×</button></span>`).join('')||'<span class="mini">None yet.</span>'}
    </div>
    <div class="hint">Monthly ₹ = fixed amount the person gets each month (e.g. Nitin Kumar ₹15,000). Manage it in <b>Monthly Allowance</b>.</div>
  </div>`;
}
function addPersonMaster(){
  const name=val2('pp_name').trim(); if(!name){toast("Enter a name");return;}
  if(DB.people.some(p=>p.name===name)){toast("Already exists");return;}
  DB.people.push({name,phone:val2('pp_phone').trim(),allowance:parseFloat(val2('pp_alw'))||0});save();render();toast("Added ✔");
}
function editPerson(name){
  const p=DB.people.find(x=>x.name===name); if(!p)return;
  openModal("Edit Person",`<label class="fl">Name</label><input id="ep_name" class="inp" value="${esc(p.name)}"><label class="fl" style="margin-top:10px">Phone</label><input id="ep_phone" class="inp" value="${esc(p.phone)}" placeholder="10-digit mobile"><label class="fl" style="margin-top:10px">Monthly allowance (₹)</label><input id="ep_alw" class="inp" type="number" min="0" value="${(+p.allowance||0)||''}" placeholder="e.g. 15000 — leave blank if none"><div class="hint">Fixed amount this person gets every month; expenses deduct from it.</div>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="doEditPerson('${esc(name)}')">Save</button>`);
  setTimeout(()=>document.getElementById('ep_name').focus(),50);
}
function doEditPerson(oldName){
  const p=DB.people.find(x=>x.name===oldName); if(!p)return;
  const nn=val2('ep_name').trim(); if(!nn){closeModal();return;}
  if(nn!==oldName && DB.people.some(x=>x.name===nn)){toast("Name already exists");return;}
  if(nn!==oldName){DB.entries.forEach(e=>{if(e.person===oldName)e.person=nn;}); if(_ledgerPerson===oldName)_ledgerPerson=nn;}
  p.name=nn; p.phone=val2('ep_phone').trim(); p.allowance=parseFloat(val2('ep_alw'))||0;
  save();closeModal();render();toast("Saved ✔");
}
function removePerson(i){
  const p=DB.people[i]; const used=DB.entries.filter(e=>e.person===p.name).length;
  openModal("Remove "+esc(p.name)+"?",used?`<p><b>${esc(p.name)}</b> is used in <b>${used}</b> entr${used>1?'ies':'y'}. Those entries stay, but the name leaves the dropdowns.</p>`:`<p>Remove <b>${esc(p.name)}</b>?</p>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="doRemovePerson(${i})">Remove</button>`);
}
function doRemovePerson(i){DB.people.splice(i,1);save();closeModal();render();toast("Removed");}

function addMaster(field){
  const inp=document.getElementById('add_'+field); const v=inp.value.trim();
  if(!v)return; if(DB[field].includes(v)){toast("Already exists");return;}
  DB[field].push(v); save(); render(); toast("Added ✔");
}
function renameMaster(field,i){
  const old=DB[field][i];
  openModal("Rename",`<label class="fl">New name</label><input id="rn" class="inp" value="${esc(old)}">`,
   `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick="doRename('${field}',${i})">Save</button>`);
  setTimeout(()=>document.getElementById('rn').focus(),50);
}
function doRename(field,i){
  const v=document.getElementById('rn').value.trim(); if(!v){closeModal();return;}
  const old=DB[field][i]; DB[field][i]=v;
  const map={sites:'site',heads:'head'}[field];
  DB.entries.forEach(e=>{if(e[map]===old)e[map]=v;});
  const nb={};Object.entries(DB.budgets).forEach(([k,val])=>{const[s,h]=k.split("||");const ns=(field==="sites"&&s===old)?v:s;const nh=(field==="heads"&&h===old)?v:h;nb[ns+"||"+nh]=val;});DB.budgets=nb;
  save();closeModal();render();toast("Renamed ✔");
}
function removeMaster(field,i){
  const val=DB[field][i]; const map={sites:'site',heads:'head'}[field];
  const used=DB.entries.filter(e=>e[map]===val).length;
  openModal("Remove "+esc(val)+"?",used?`<p><b>${esc(val)}</b> is used in <b>${used}</b> entr${used>1?'ies':'y'}. Those entries stay, but it leaves the dropdowns.</p>`:`<p>Remove <b>${esc(val)}</b>?</p>`,
    `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="doRemove('${field}',${i})">Remove</button>`);
}
function doRemove(field,i){DB[field].splice(i,1);save();closeModal();render();toast("Removed");}

/* ===================== BACKUP ===================== */
function exportBackup(){dl("expense_backup_"+todayISO()+".json",JSON.stringify(DB,null,2),"application/json");toast("Backup downloaded");}
function importBackup(inp){
  const f=inp.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);
    if(!d.entries){toast("Not a valid backup");return;}
    openModal("Import backup?",`<p>This file has <b>${d.entries.length}</b> entries, <b>${(d.sites||[]).length}</b> sites, <b>${(d.people||[]).length}</b> persons.</p>
      <label class="fl" style="margin-top:8px">How to import?</label>
      <div class="row-flex"><label><input type="radio" name="imode" value="replace" checked> Replace everything</label><label><input type="radio" name="imode" value="merge"> Merge (add entries)</label></div>`,
      `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn p" onclick='doImport(${JSON.stringify(JSON.stringify(d))})'>Import</button>`);
  }catch(e){toast("Could not read file");}};
  r.readAsText(f); inp.value="";
}
function doImport(str){
  const d=JSON.parse(JSON.parse(str));
  if(d.people&&d.people.length&&typeof d.people[0]==="string") d.people=d.people.map(n=>({name:n,phone:"",allowance:0}));
  (d.people||[]).forEach(p=>{if(p.allowance===undefined)p.allowance=0;});
  (d.entries||[]).forEach(e=>{if(e.mode===undefined)e.mode="Cash";});
  const mode=[...document.querySelectorAll('input[name=imode]')].find(x=>x.checked).value;
  if(mode==="replace"){DB=Object.assign(JSON.parse(JSON.stringify(DEFAULT)),d);}
  else{
    const ids=new Set(DB.entries.map(e=>e.id));
    (d.entries||[]).forEach(e=>{if(!ids.has(e.id))DB.entries.push(e);});
    ["sites","heads"].forEach(f=>(d[f]||[]).forEach(x=>{if(!DB[f].includes(x))DB[f].push(x);}));
    (d.people||[]).forEach(p=>{if(!DB.people.some(q=>q.name===p.name))DB.people.push(p);});
    Object.assign(DB.budgets,d.budgets||{});
  }
  save();closeModal();render();toast("Imported ✔");
}
function exportCSVall(){const bak=_hf;_hf={q:"",site:"__all",head:"__all",person:"__all",kind:"__all",mode:"__all",from:"",to:""};exportCSV();_hf=bak;}
function wipe(){openModal("Clear ALL data?",`<p>This permanently deletes <b>all entries, budgets and masters</b> in this browser. Export a backup first if unsure.</p>`,
  `<button class="btn" onclick="closeModal()">Cancel</button><button class="btn danger" onclick="doWipe()">Yes, clear everything</button>`);}
function doWipe(){DB=JSON.parse(JSON.stringify(DEFAULT));save();closeModal();go('dashboard');toast("All data cleared");}
